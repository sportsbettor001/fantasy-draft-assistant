// ============================================================
// LIVE DATA ADAPTERS — called directly from the browser, no
// server involved. Both are free, public, no API key.
//
// Sleeper API: https://docs.sleeper.com — rosters, teams, injury/
// practice status, depth chart hints. Full player list, no auth.
//
// Fantasy Football Calculator ADP API:
// https://help.fantasyfootballcalculator.com/article/42-adp-rest-api
// Real human-draft ADP by scoring format/league size/year. No auth.
// ============================================================
// Bump this every time an updated file is sent, so it's visible on-page
// which version you're running without guessing from memory.
const APP_VERSION = "v2.2";

const VALID_POSITIONS = new Set(["QB","RB","WR","TE","K","DEF"]);
const PLAYERS_CACHE_KEY = "fda_live_players_v1";
const ADP_CACHE_KEY = "fda_live_adp_v1";

function normalizeSleeperPosition(p) {
  if (p.position && VALID_POSITIONS.has(p.position)) return p.position;
  if (Array.isArray(p.fantasy_positions)) {
    const match = p.fantasy_positions.find(fp => VALID_POSITIONS.has(fp));
    if (match) return match;
  }
  return null;
}

async function syncSleeperPlayers() {
  const url = "https://api.sleeper.app/v1/players/nfl";
  const res = await tracedFetch("Sync rosters (Sleeper)", url);
  const raw = await res.json();
  const now = new Date().toISOString();
  const players = [];
  for (const id of Object.keys(raw)) {
    const p = raw[id];
    if (!p) continue;
    const position = normalizeSleeperPosition(p);
    if (!position) continue;
    players.push({
      id, name: p.full_name || ((p.first_name||"")+" "+(p.last_name||"")).trim(),
      position, team: p.team ?? null, age: p.age ?? null,
      status: p.status ?? null, injuryStatus: p.injury_status ?? null,
      injuryBodyPart: p.injury_body_part ?? null,
      depthChartOrder: p.depth_chart_order ?? null,
    });
  }
  localStorage.setItem(PLAYERS_CACHE_KEY, JSON.stringify({ updatedAt: now, players }));
  return { updatedAt: now, players };
}

const FFC_FORMAT_MAP = { standard:"standard", half_ppr:"half-ppr", ppr:"ppr", superflex:"2qb", two_qb:"2qb", dynasty:"dynasty", keeper:"standard" };

async function syncFfcAdp(scoringFormat, leagueSize) {
  const format = FFC_FORMAT_MAP[scoringFormat] || "standard";
  const year = new Date().getFullYear();
  const url = "https://fantasyfootballcalculator.com/api/v1/adp/" + format + "?teams=" + leagueSize + "&year=" + year;
  let cached;
  try {
    const res = await fetchDirectOrProxied("Sync ADP (Fantasy Football Calculator)", url);
    const data = await res.json();
    const now = new Date().toISOString();
    const entries = (data.players || []).map(p => ({ name: p.name, position: p.position, team: p.team ?? null, adp: p.adp }));
    cached = { updatedAt: now, format, teams: leagueSize, year, entries, isStaticFallback: false };
  } catch (e) {
    logTrace("Sync ADP (Fantasy Football Calculator)", url, "fallback", "Live sync fully failed (direct + both proxies) — using embedded static snapshot from " + STATIC_ADP_FALLBACK_DATE + " instead.");
    cached = { updatedAt: STATIC_ADP_FALLBACK_DATE, format, teams: leagueSize, year, entries: STATIC_ADP_FALLBACK, isStaticFallback: true };
  }
  localStorage.setItem(ADP_CACHE_KEY, JSON.stringify(cached));
  return cached;
}

function loadCachedPlayers() {
  try { return JSON.parse(localStorage.getItem(PLAYERS_CACHE_KEY)) || { updatedAt: null, players: [] }; }
  catch { return { updatedAt: null, players: [] }; }

function loadCachedAdp() {

// ============================================================
// ESPN — NFL Teams + Depth Charts
// -----------------------------------------------------------
// Organization: ESPN (Disney)
// Endpoints used:
//   https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams
//   https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/{id}/depthcharts
// Auth: none. Cost: free.
// Status: UNOFFICIAL / UNDOCUMENTED. These are the endpoints ESPN's own
// website and apps call internally — widely relied on by the fantasy
// football developer community, no API key or signup required, currently
// live and stable in practice — but ESPN does not publish them as a
// supported public API and could change the shape or break them without
// notice. If the Teams tab ever shows a parsing error, that's almost
// certainly what happened; tell Claude and the parsing logic below can be
// patched to match ESPN's current response shape.
// ============================================================
const ESPN_TEAMS_URL = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=32";
const TEAMS_CACHE_KEY = "fda_live_teams_v1";
const DEPTHCHARTS_CACHE_KEY = "fda_live_depthcharts_v1";

async function syncEspnTeams() {
  const now = new Date().toISOString();
  try {
    const res = await fetchDirectOrProxied("Sync teams (ESPN)", ESPN_TEAMS_URL);
    const data = await res.json();
    const rawTeams = data?.sports?.[0]?.leagues?.[0]?.teams || [];
    const teams = rawTeams.map(t => {
      const team = t.team || t;
      return {
        id: String(team.id),
        name: team.displayName || team.name || "Unknown",
        abbreviation: team.abbreviation || "",
        location: team.location || "",
        logo: team.logos?.[0]?.href || espnLogoUrl((team.abbreviation || "").toUpperCase()),
      };
    }).sort((a,b) => a.name.localeCompare(b.name));
    const cached = { updatedAt: now, teams, isStaticFallback: false };
    localStorage.setItem(TEAMS_CACHE_KEY, JSON.stringify(cached));
    return cached;
  } catch (e) {
    logTrace("Sync teams (ESPN)", ESPN_TEAMS_URL, "fallback", "Live sync fully failed (direct + both proxies) — using embedded team list instead. Depth charts still need a live ESPN connection and won't be available until that's reachable again.");
    const cached = { updatedAt: now, teams: STATIC_TEAMS_FALLBACK, isStaticFallback: true };
    localStorage.setItem(TEAMS_CACHE_KEY, JSON.stringify(cached));
    return cached;
  }
}

function loadCachedTeams() {
  try { return JSON.parse(localStorage.getItem(TEAMS_CACHE_KEY)) || { updatedAt: null, teams: [] }; }
  catch { return { updatedAt: null, teams: [] }; }
}
function loadCachedDepthCharts() {
  try { return JSON.parse(localStorage.getItem(DEPTHCHARTS_CACHE_KEY)) || {}; }
  catch { return {}; }
}
function saveCachedDepthCharts(obj) { localStorage.setItem(DEPTHCHARTS_CACHE_KEY, JSON.stringify(obj)); }

// Fetched lazily, one team at a time, only when you open that team's card —
// not all 32 up front, to stay light on an unofficial endpoint.
async function fetchTeamDepthChart(teamId) {
  const url = "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/" + teamId + "/depthcharts";
  const res = await fetchDirectOrProxied("Depth chart (ESPN) — team " + teamId, url);
  const data = await res.json();
  const now = new Date().toISOString();

  // Defensive parsing: ESPN's shape here is undocumented and has varied
  // across sports/seasons in community reports. Try the commonly-seen
  // shape first; fall back to raw JSON display if it doesn't match so the
  // app degrades gracefully instead of crashing.
  const groups = [];
  try {
    const items = data?.items || data?.[0]?.items || [];
    for (const item of items) {
      const posName = item.position?.displayName || item.position?.name || item.position?.abbreviation || "Position";
      const athletes = (item.athletes || item.positions || []).map((a, i) => {
        const athlete = a.athlete || a;
        return {
          rank: a.rank ?? (i + 1),
          name: athlete.displayName || athlete.fullName || athlete.name || "Unknown",
          jersey: athlete.jersey || null,
        };
      });
      if (athletes.length) groups.push({ position: posName, athletes });
    }
  } catch (e) {
    // fall through — groups stays empty, caller shows raw JSON instead
  }

  const result = { updatedAt: now, groups, raw: groups.length ? null : data };
  const cache = loadCachedDepthCharts();
  cache[teamId] = result;
  saveCachedDepthCharts(cache);
  return result;
}

// ============================================================
// DRAFT SCORE ENGINE — rule-based and transparent. ADP (blended from
// Consensus + Claude's own ranking) and positional scarcity are the
// primary drivers by default — no projections required. If you do
// import a projections CSV, it's blended in as a modest bonus on top,
// not a hard requirement the way it used to be.
// ============================================================
const WEIGHTS = { adpValue:.20, rankQuality:.35, scarcity:.20, news:.15, rosterFit:.10 };
const PROJECTION_BONUS_WEIGHT = 0.12; // only applied when projPoints is actually present
const STARTERS_PER_TEAM = { QB:1.2, RB:2.5, WR:2.7, TE:1.1, K:1, DEF:1 };
const NEWS_PENALTY = { green:0, yellow:12, orange:28, red:55 };

function injuryCategoryOf(injuryStatus, status) {
  const s = (injuryStatus || "").toLowerCase();
  if (s.includes("out") || s.includes("ir") || s.includes("pup") || s.includes("suspended")) return "red";
  if (s.includes("doubtful")) return "orange";
  if (s.includes("questionable")) return "yellow";
  if ((status || "").toLowerCase().includes("inactive")) return "orange";
  return "green";
}

// Replacement-level ADP per position: the ADP of the Nth-best player at
// that position, where N = roughly how many teams will start that
// position. Lower ADP = better, so "best" here means lowest ADP.
function adpReplacementLevel(pool, position, leagueSize) {
  const atPos = pool.filter(p => p.position===position && p.adp!=null).sort((a,b)=>a.adp-b.adp);
  if (!atPos.length) return null;
  const rank = Math.max(1, Math.round(leagueSize * STARTERS_PER_TEAM[position]));
  const idx = Math.min(rank, atPos.length-1);
  return atPos[idx].adp;
}
function computeAdpTiers(sortedByAdp) {
  const tiers = new Map();
  if (!sortedByAdp.length) return tiers;
  const vals = sortedByAdp.map(p=>p.adp);
  const gaps = vals.slice(0,-1).map((v,i)=>vals[i+1]-v);
  const avgGap = gaps.reduce((a,b)=>a+b,0)/Math.max(1,gaps.length) || 1;
  let tier=1; tiers.set(sortedByAdp[0].id, tier);
  for (let i=1;i<sortedByAdp.length;i++){ const gap=vals[i]-vals[i-1]; if (gap>avgGap*1.8 && gap>1) tier++; tiers.set(sortedByAdp[i].id, tier); }
  return tiers;
}
// Legacy points-based tiering, only used as a bonus signal when a
// player actually has an imported projection.
function computePointsTiers(sorted) {
  const tiers = new Map();
  if (!sorted.length) return tiers;
  const pts = sorted.map(p=>p.projPoints??0);
  const gaps = pts.slice(0,-1).map((p,i)=>p-pts[i+1]);
  const avgGap = gaps.reduce((a,b)=>a+b,0)/Math.max(1,gaps.length) || 1;
  let tier=1; tiers.set(sorted[0].id, tier);
  for (let i=1;i<sorted.length;i++){ const gap=pts[i-1]-pts[i]; if (gap>avgGap*1.8 && gap>1) tier++; tiers.set(sorted[i].id, tier); }
  return tiers;
}
function pointsReplacementLevel(pool, position, leagueSize) {
  const atPos = pool.filter(p => p.position===position && p.projPoints!=null).sort((a,b)=>b.projPoints-a.projPoints);
  if (!atPos.length) return null;
  const rank = Math.max(1, Math.round(leagueSize * STARTERS_PER_TEAM[position]));
  const idx = Math.min(rank, atPos.length-1);
  return atPos[idx].projPoints;
}

function scoreAllPlayers({ pool, settings, currentOverallPick, myRosterCounts, myByeWeekCounts }) {
  myByeWeekCounts = myByeWeekCounts || new Map();
  const results = new Map();
  const positions = ["QB","RB","WR","TE","K","DEF"];
  const adpTiersByPosition = {}, adpTierRemaining = {};
  const ptsReplacement = {}, ptsTiersByPosition = {}, maxPtsSpread = {};

  // Global ADP range across ALL cataloged players, regardless of position.
  // This is what actually determines "who's better right now" at the top
  // of a draft — ADP already encodes real-world position value tradeoffs
  // (that's what thousands of real human drafters picking earlier for RBs
  // than QBs literally means). A per-position "replacement level" is only
  // meaningful once enough players are cataloged at that position to make
  // the comparison fair — with a small hand-researched list, a thin
  // position (fewer players cataloged) falsely looks like it has a huge
  // edge. Using the global range avoids that distortion.
  const allCatalogedAdp = pool.filter(p => p.adp != null).map(p => p.adp);
  const globalMinAdp = allCatalogedAdp.length ? Math.min(...allCatalogedAdp) : 1;
  const globalMaxAdp = allCatalogedAdp.length ? Math.max(...allCatalogedAdp) : 200;
  const globalAdpSpread = Math.max(1, globalMaxAdp - globalMinAdp);

  for (const pos of positions) {
    const sortedByAdp = pool.filter(p=>p.position===pos && p.adp!=null).sort((a,b)=>a.adp-b.adp);
    adpTiersByPosition[pos] = computeAdpTiers(sortedByAdp);
    adpTierRemaining[pos] = {};
    for (const t of adpTiersByPosition[pos].values()) adpTierRemaining[pos][t] = (adpTierRemaining[pos][t] || 0) + 1;

    const sortedByPts = pool.filter(p=>p.position===pos && p.projPoints!=null).sort((a,b)=>b.projPoints-a.projPoints);
    ptsReplacement[pos] = pointsReplacementLevel(pool, pos, settings.leagueSize);
    ptsTiersByPosition[pos] = computePointsTiers(sortedByPts);
    maxPtsSpread[pos] = Math.max(1, (sortedByPts[0]?.projPoints ?? 0) - (ptsReplacement[pos] ?? 0));
  }
  // Scarcity counts only players we actually have data on (cataloged ADP),
  // not the full raw Sleeper roster (which includes thousands of
  // practice-squad-tier players at every position that were never
  // realistically "available" in a fantasy sense). Counting the full
  // roster made scarcity saturate to 0 immediately for every position.
  const remainingStartable = {};
  for (const pos of positions) {
    const startableCount = Math.round(settings.leagueSize * STARTERS_PER_TEAM[pos]);
    const catalogedAtPos = pool.filter(p=>p.position===pos && p.adp!=null).length;
    remainingStartable[pos] = Math.min(catalogedAtPos, startableCount);
  }

  for (const player of pool) {
    const pos = player.position, reasons=[], flags=[];
    if (player.expertSleeper) { flags.push({type:"sleeper", label:"🏆 Expert Sleeper Pick"}); reasons.push(player.expertSleeper); }
    if (player.expertConcern) { flags.push({type:"bust_risk", label:"⚠ Regression Risk"}); reasons.push(player.expertConcern); }

    // --- Rank quality: how good is this player overall, using blended
    // ADP standing across ALL positions (lower ADP = better), not siloed
    // per-position. This is the primary "is this player actually good"
    // component, replacing the old points-based VORP as the default.
    let rankQualityScore = 50;
    if (player.adp != null) {
      rankQualityScore = clamp01((globalMaxAdp - player.adp) / globalAdpSpread) * 100;
      reasons.push(`Blended ADP ${player.adp.toFixed(1)} overall`);
    } else {
      reasons.push("No ADP data yet for this player — sync ADP or ask Claude to check for news");
    }

    // --- ADP value: is this a value or a reach *right now*, at the
    // current pick. FIXED sign convention: "value" means the player is
    // STILL here despite their ADP saying they should be long gone
    // (current pick has passed their ADP) — not simply "their ADP number
    // is numerically bigger than the current pick," which is true of
    // almost every player early in a draft and was previously being
    // mislabeled as a "steal."
    let adpValueScore = 50;
    if (player.adp!=null) {
      const picksPastAdp = currentOverallPick - player.adp; // positive = falling past ADP (value); negative = reach
      adpValueScore = clamp01(0.5 + picksPastAdp/40) * 100;
      if (picksPastAdp>=12) { flags.push({type:"steal", label:`Falling ~${Math.round(picksPastAdp)} picks past ADP`}); reasons.push(`Great value: blended ADP is pick ${Math.round(player.adp)}, ${Math.round(picksPastAdp)} picks ago`); }
      else if (picksPastAdp<=-12) { flags.push({type:"reach", label:`Reaching ~${Math.round(-picksPastAdp)} picks ahead of ADP`}); reasons.push(`This is a reach: blended ADP is pick ${Math.round(player.adp)}, ${Math.round(-picksPastAdp)} picks from now`); }
    }

    // --- Scarcity ---
    // K/DEF are excluded from positional scarcity entirely: there are 32
    // of each, they're freely streamed all season, and — critically —
    // our hand-researched ADP catalog only covers a couple of them,
    // which was making the math think they were desperately scarce
    // (2 cataloged out of "12 needed" looked like almost none left).
    // Real fantasy strategy doesn't chase K/DEF scarcity, so don't model it.
    const startableCount = Math.round(settings.leagueSize * STARTERS_PER_TEAM[pos]);
    const scarcityRatio = (pos==="K"||pos==="DEF") ? 0 : 1 - clamp01(remainingStartable[pos] / Math.max(1,startableCount));
    const scarcityScore = scarcityRatio*100;
    if (pos!=="K" && pos!=="DEF" && remainingStartable[pos] <= settings.leagueSize*0.5) { flags.push({type:"scarcity", label:`Only ~${remainingStartable[pos]} startable ${pos}s left`}); reasons.push(`${pos} is getting thin — only ~${remainingStartable[pos]} startable options remain`); }

    const tier = adpTiersByPosition[pos].get(player.id) ?? 1;
    if ((adpTierRemaining[pos][tier] || 0) <= 1 && player.adp != null) {
      flags.push({type:"scarcity", label:`Last Tier ${tier} ${pos} on the board`});
      reasons.push(`Tier break alert: this is the last Tier ${tier} ${pos} left by ADP — next options are a real step down`);
    }

    const playerBye = BYE_WEEKS[player.team];
    if (playerBye != null && (myByeWeekCounts.get(playerBye) || 0) >= 2) {
      flags.push({type:"bye_stack", label:`Bye stack: wk ${playerBye} (already have 2+)`});
      reasons.push(`Bye week warning: you'd have 3+ players out in Week ${playerBye}`);
    }

    // --- News/health — real researched news (player.newsNote) takes
    // priority over the generic Sleeper status label when available.
    const category = player.injuryCategory || "green";
    const newsScore = 100 - NEWS_PENALTY[category];
    if (player.newsNote) {
      flags.push({type: category==="green" ? "news" : "injury", label:(category!=="green"?category.toUpperCase()+": ":"")+ (player.name)+" — news"});
      reasons.unshift(player.newsNote);
    } else if (category==="red"||category==="orange") {
      flags.push({type:"injury", label:`${category.toUpperCase()}: ${player.injuryStatus||player.status}`});
      reasons.push(`Injury risk (${category}): ${player.injuryStatus||player.status||"check status"}`);
    } else if (category==="yellow" && player.injuryStatus) {
      reasons.push(`Monitor: ${player.injuryStatus}`);
    }

    const need = rosterNeedScore(pos, myRosterCounts, settings);
    if (need>70) reasons.push(`Fills a real roster need at ${pos}`);
    if (need<25) reasons.push(`${pos} is already well-stocked on your roster`);

    let score = rankQualityScore*WEIGHTS.rankQuality + adpValueScore*WEIGHTS.adpValue + scarcityScore*WEIGHTS.scarcity + newsScore*WEIGHTS.news + need*WEIGHTS.rosterFit;

    // Optional bonus if a projection was actually imported — nudges the
    // score, doesn't replace the ADP-driven base the way it used to.
    if (player.projPoints != null && ptsReplacement[pos] != null) {
      const vorp = player.projPoints - ptsReplacement[pos];
      const vorpScore = clamp01(vorp / maxPtsSpread[pos]) * 100;
      score = score * (1 - PROJECTION_BONUS_WEIGHT) + vorpScore * PROJECTION_BONUS_WEIGHT;
      reasons.push(`Projection bonus: ${player.projPoints.toFixed(1)} pts, ${vorp>=0?"+":""}${vorp.toFixed(1)} over replacement`);
    }

    // K/DEF hard dampening: no formula tweak alone reliably keeps these
    // out of "best pick" territory in every scenario, and real fantasy
    // strategy is unambiguous — draft a kicker or defense in your last
    // couple of rounds, full stop. This caps their score explicitly
    // until the draft has actually reached that point, as a backstop on
    // top of the scarcity fix above rather than relying on it alone.
    if (pos === "K" || pos === "DEF") {
      const totalPicks = settings.leagueSize * (settings.totalRounds || 15);
      const lateRoundStart = totalPicks - settings.leagueSize * 2; // last 2 rounds
      if (currentOverallPick < lateRoundStart) {
        score = Math.min(score, 30);
        reasons.push(`${pos} is capped low until the last couple rounds — not worth rostering early regardless of matchup`);
      }
    }

    results.set(player.id, { score: Math.round(clamp(score,0,100)), tier, reasons: reasons.slice(0,6), flags });
  }
  return results;
}
function rosterNeedScore(pos, myRosterCounts, settings) {
  const targets = { QB:settings.rosterSlots.QB + (settings.scoringFormat==="superflex"||settings.scoringFormat==="two_qb"?1:0), RB:settings.rosterSlots.RB+Math.ceil(settings.rosterSlots.FLEX*0.5)+1, WR:settings.rosterSlots.WR+Math.ceil(settings.rosterSlots.FLEX*0.5)+1, TE:settings.rosterSlots.TE+1, K:settings.rosterSlots.K, DEF:settings.rosterSlots.DEF };
  const have = myRosterCounts[pos] ?? 0, target = Math.max(1, targets[pos]);
  return clamp01(1 - have/target) * 100;
}
function clamp(n,min,max){ return Math.min(max, Math.max(min,n)); }
function clamp01(n){ return clamp(n,0,1); }


// ============================================================
// GRADING HELPERS — disclosed, simple formulas, not fake ML
// probabilities. Every grade shown in the UI traces back to one
// of these, and the underlying number is always shown alongside
// the letter so it's auditable, not a black box.
// ============================================================
function letterGrade(ratio) {
  if (ratio >= 1.4) return "A";
  if (ratio >= 1.15) return "A-";
  if (ratio >= 1.0) return "B+";
  if (ratio >= 0.8) return "B";
  if (ratio >= 0.6) return "C";
  if (ratio >= 0.4) return "D";
  return "F";
}
const GRADE_COLOR = {
  "A":"text-turf-400", "A-":"text-turf-400", "B+":"text-turf-400",
  "B":"text-amber-400", "C":"text-amber-400", "D":"text-crimson-400", "F":"text-crimson-400",
};

// Team Need Grade: how well-stocked YOUR roster is at each position,
// relative to what a normal starting lineup for your settings needs.
// ratio = players you have / target count. >=1.0 means fully stocked.
function computeTeamGrades(rosterCounts, settings) {
  const targets = {
    QB: settings.rosterSlots.QB + (settings.scoringFormat==="superflex"||settings.scoringFormat==="two_qb" ? 1 : 0),
    RB: settings.rosterSlots.RB + Math.ceil(settings.rosterSlots.FLEX*0.5),
    WR: settings.rosterSlots.WR + Math.ceil(settings.rosterSlots.FLEX*0.5),
    TE: settings.rosterSlots.TE,
    K: settings.rosterSlots.K,
    DEF: settings.rosterSlots.DEF,
  };
  const grades = {};
  for (const pos of ["QB","RB","WR","TE","K","DEF"]) {
    const have = rosterCounts[pos] ?? 0;
    const target = Math.max(1, targets[pos]);
    const ratio = have / target;
    grades[pos] = { have, target, ratio, letter: letterGrade(ratio) };
  }
  return grades;
}

// Opponent Value Grade: average ADP value they got across their picks
// (positive = they got players later than expected = good value; negative
// = they reached). This is the same ADP-value math already used in the
// Draft Score engine, just averaged per team instead of per player.
function computeOpponentGrade(picks, playerLookup, adpLookup) {
  const values = [];
  for (const pick of picks) {
    const adp = adpLookup.get(pick.playerId);
    if (adp != null) values.push(adp - pick.overallPick);
  }
  const avg = values.length ? values.reduce((a,b)=>a+b,0) / values.length : null;
  let letter = "—";
  if (avg != null) {
    if (avg >= 8) letter = "A";
    else if (avg >= 3) letter = "B";
    else if (avg >= -3) letter = "C";
    else if (avg >= -8) letter = "D";
    else letter = "F";
  }
  return { avgValue: avg, letter };
}

// ============================================================
// NAME MATCHING (for ADP + expert picks -> Sleeper player IDs)
// ============================================================
// Escapes any external/untrusted text (player names, team names, error
// messages, etc.) before it's inserted into the page. Without this, a
// malicious or compromised API/proxy response could theoretically embed
// HTML/script in a text field and have it execute — this closes that off.
// Applied at render time (not at data-ingestion time) so name-matching
// logic elsewhere keeps working on the original, unescaped strings.
function esc(str) {
  if (str == null) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function normalizeName(name) {
  return (name || "").toLowerCase()
    .replace(/[.'']/g, "")
    .replace(/\b(jr|sr|ii|iii|iv|v)\b/g, "")
    .replace(/[^a-z0-9\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();
}
function buildNameIndex(list) {
  const idx = new Map();
  for (const p of list) {
    const key = normalizeName(p.name);
    const arr = idx.get(key) ?? [];
    arr.push(p);
    idx.set(key, arr);
  }
  return idx;
}
function matchPlayer(index, name, position) {
  const candidates = index.get(normalizeName(name));
  if (!candidates || candidates.length === 0) return null;
  if (candidates.length === 1) return candidates[0];
  if (position) {
    const byPos = candidates.find(c => c.position === (position||"").toUpperCase());
    if (byPos) return byPos;
  }
  return candidates[0];
}

// Reports how many ADP (or any name-keyed) entries actually matched
// against the currently synced player list, and logs a few unmatched
// examples to Trace — so "0 matched" (a name-format mismatch) can be
// told apart from "fetched 0 rows" (a response-shape problem) instead
// of both just looking like "blank data" in the table.
function diagnoseAdpMatching(entries) {
  const index = buildNameIndex(playersCache.players || []);
  let matched = 0;
  const unmatchedSamples = [];
  for (const row of entries) {
    if (matchPlayer(index, row.name, row.position)) matched++;
    else if (unmatchedSamples.length < 8) unmatchedSamples.push(row.name + " (" + row.position + ")");
  }
  if (entries.length && matched === 0) {
    logTrace("ADP name-matching diagnostic", "(local, no network)", "zero_matches",
      "Fetched " + entries.length + " ADP rows but matched 0 to synced rosters (" + (playersCache.players||[]).length + " players cached). " +
      "Sample unmatched ADP names: " + unmatchedSamples.join(", ") + ". " +
      "If rosters weren't synced first, sync Sleeper rosters before ADP. If rosters ARE synced, this points to a name-format mismatch between sources.");
  } else if (entries.length && matched < entries.length * 0.5) {
    logTrace("ADP name-matching diagnostic", "(local, no network)", "low_match_rate",
      "Matched only " + matched + " of " + entries.length + ". Sample unmatched: " + unmatchedSamples.join(", "));
  }
  return { matched, total: entries.length };
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",").map(h => h.trim().toLowerCase().replace(/\s+/g,"_"));
  return lines.slice(1).map(line => {
    const cells = line.split(",").map(c => c.trim());
    const row = {};
    headers.forEach((h,i) => row[h] = cells[i]);
    return row;
  });
}

// ============================================================
// TRACE LOG — records every live-data attempt with full diagnostic
// detail, so failures can be copy-pasted and reported instead of just
// seeing a generic "Failed: Load failed" message. Kept in memory for
// the current session (not persisted — it's for live debugging).
// ============================================================
let traceLog = [];
function logTrace(action, url, status, detail) {
  traceLog.push({
    time: new Date().toISOString(),
    action, url, status, detail: detail || "",
  });
  if (traceLog.length > 300) traceLog.shift(); // keep it bounded
}
async function tracedFetch(action, url, options) {
  logTrace(action, url, "start", "");
  try {
    const res = await fetch(url, options);
    if (!res.ok) {
      let bodySnippet = "";
      try { bodySnippet = (await res.text()).slice(0, 300); } catch {}
      logTrace(action, url, "http_error", "HTTP " + res.status + " " + res.statusText + (bodySnippet ? " — body: " + bodySnippet : ""));
      throw new Error("HTTP " + res.status + " " + res.statusText);
    }
    let snippet = "";
    try { snippet = (await res.clone().text()).slice(0, 200); } catch {}
    logTrace(action, url, "ok", "HTTP " + res.status + (snippet ? " — response starts: " + snippet : ""));
    return res;
  } catch (e) {
    // A bare "TypeError: Load failed" / "TypeError: Failed to fetch" with
    // no HTTP status at all almost always means the request never reached
    // the server — most commonly CORS, sometimes offline/DNS. A real HTTP
    // error (4xx/5xx) reaching this catch would have a status already
    // logged above.
    const looksLikeCorsOrNetwork = e instanceof TypeError;
    logTrace(action, url, "js_error", (e.name || "Error") + ": " + e.message + (looksLikeCorsOrNetwork ? " (no HTTP status reached the browser — likely CORS block or network/DNS issue, not a server error)" : ""));
    throw e;
  }
}

// ============================================================
// CORS PROXY FALLBACK
// -----------------------------------------------------------
// ESPN and Fantasy Football Calculator don't send CORS headers that
// allow a page hosted on github.io to call them directly (confirmed via
// the Trace tab — "Load failed" with no HTTP status = the browser
// blocked it before it ever reached their server). Sleeper does allow
// this, which is why only these two need a fallback.
//
// Two free, unofficial public CORS proxies are tried in order. Neither
// is affiliated with ESPN, FFC, or Anthropic, and both have shown real
// downtime in practice (confirmed via the Trace tab) — this is exactly
// the "free proxies come and go" tradeoff that was flagged up front, not
// a new problem. If BOTH fail, the calling function falls back to a
// static embedded snapshot rather than just erroring out — see
// STATIC_ADP_FALLBACK / STATIC_TEAMS_FALLBACK below.
// ============================================================
const CORS_PROXIES = [
  url => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
  url => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
];

async function fetchDirectOrProxied(action, url) {
  try {
    return await tracedFetch(action, url);
  } catch (e) {
    if (!(e instanceof TypeError)) throw e; // real HTTP error — a proxy won't fix that, don't mask it
  }
  let lastErr;
  for (let i = 0; i < CORS_PROXIES.length; i++) {
    try {
      return await tracedFetch(action + " (via CORS proxy " + (i+1) + " — direct call was blocked)", CORS_PROXIES[i](url));
    } catch (e) {
      lastErr = e;
    }
  }
  throw lastErr;
}

function sortableTh(key, label, widthClass) {
  const active = sortKey === key;
  const arrow = active ? (sortDir==="asc"?" ▲":" ▼") : "";
  return '<th data-sort-key="'+key+'" class="text-left px-3 py-2 '+widthClass+' cursor-pointer select-none hover:text-slate2-200'+(active?" text-turf-400":"")+'">'+label+arrow+'</th>';
}
const SORT_ACCESSORS = {
  score: (p,scores) => scores.get(p.id)?.score ?? -1,
  name: p => p.name.toLowerCase(),
  position: p => p.position,
  team: p => p.team || "",
  adp: p => p.consensusAdp ?? Infinity,
  claudeAdp: p => p.claudeAdp ?? Infinity,
  myRank: p => p.myRank ?? Infinity,
  projPoints: p => p.projPoints ?? -1,
  injury: p => ({red:0,orange:1,yellow:2,green:3}[p.injuryCategory] ?? 4),
  flags: (p,scores) => {
    const flags = scores.get(p.id)?.flags || [];
    const weight = { sleeper:3, steal:3, scarcity:2, bye_stack:1, news:1, injury:-2, reach:-2, bust_risk:-3 };
    return flags.reduce((sum,f) => sum + (weight[f.type] ?? 0), 0);
  },
};

// ============================================================
// MERGE + DRAFT BOARD
// ============================================================
function slotOnClock(overallPick, leagueSize) {
  const round = Math.ceil(overallPick / leagueSize);
  const posInRound = overallPick - (round-1) * leagueSize;
  return round % 2 === 1 ? posInRound : leagueSize - posInRound + 1;
}

function mergedPlayers() {
  const players = playersCache.players || [];
  const nameIndex = buildNameIndex(players);

  // Every "other site" ADP source: the free Fantasy Football Calculator
  // sync, plus anything the user has imported. Each contributes at most
  // one value per player; "Avg ADP" is the average across whichever of
  // these actually have that player, and it never includes Claude's ADP.
  const siteSources = [{ name: "Fantasy Football Calculator", entries: adpCache.entries || [] }];
  for (const [siteName, src] of Object.entries(otherSitesAdp)) {
    siteSources.push({ name: siteName, entries: src.entries || [] });
  }
  const siteAdpById = new Map(); // id -> [{source, adp}, ...]
  for (const site of siteSources) {
    for (const row of site.entries) {
      const match = matchPlayer(nameIndex, row.name, row.position);
      if (!match) continue;
      const list = siteAdpById.get(match.id) || [];
      list.push({ source: site.name, adp: row.adp });
      siteAdpById.set(match.id, list);
    }
  }

  const claudeAdpById = new Map();
  for (const row of CLAUDE_ADP) {
    const match = matchPlayer(nameIndex, row.name, row.position);
    if (match) claudeAdpById.set(match.id, row.adp);
  }
  const expertById = new Map();
  for (const ep of EXPERT_PICKS) {
    const match = matchPlayer(nameIndex, ep.name, ep.position);
    if (match) expertById.set(match.id, ep);
  }
  const newsById = new Map();
  for (const n of PLAYER_NEWS) {
    const match = matchPlayer(nameIndex, n.name, n.position);
    if (match) newsById.set(match.id, n);
  }
  const pickIndexByPlayer = new Map(draft.picks.map((p,i) => [p.playerId, i]));

  // Sleeper's live player list occasionally has the same real person under
  // two different IDs (a known quirk — legacy IDs, status-change
  // artifacts). Matching drafted status by exact ID alone can leave a
  // duplicate entry for an already-drafted player visible and still
  // scoring at the top of the board. Cross-check by normalized name +
  // position too, so drafting one instance correctly hides all of them.
  const byId = new Map(players.map(pl => [pl.id, pl]));
  const draftedNameKeys = new Set();
  for (const pick of draft.picks) {
    const pl = byId.get(pick.playerId);
    if (pl) draftedNameKeys.add(normalizeName(pl.name) + "|" + pl.position);
  }

  return players.map(p => {
    const proj = projections[p.id];
    const expert = expertById.get(p.id);
    const news = newsById.get(p.id);
    const idx = pickIndexByPlayer.get(p.id);
    const drafted = idx != null || draftedNameKeys.has(normalizeName(p.name) + "|" + p.position);
    const adpBreakdown = siteAdpById.get(p.id) || [];
    const consensusAdp = adpBreakdown.length ? adpBreakdown.reduce((a,b)=>a+b.adp,0)/adpBreakdown.length : null;
    const claudeAdp = claudeAdpById.get(p.id) ?? null;
    // Blended ADP drives scoring: average of Avg-ADP-across-sites and
    // Claude's ADP, whichever are present. Both are also kept as their
    // own fields so the table can show them separately.
    const adpSources = [consensusAdp, claudeAdp].filter(v => v != null);
    const blendedAdp = adpSources.length ? adpSources.reduce((a,b)=>a+b,0)/adpSources.length : null;
    return {
      ...p,
      adp: blendedAdp,
      consensusAdp,
      claudeAdp,
      adpBreakdown,
      myRank: myRanks[p.id] ?? null,
      projPoints: proj?.projPoints ?? null,
      expertSleeper: expert?.expertSleeper ?? null,
      expertConcern: expert?.expertConcern ?? null,
      newsNote: news?.note ?? null,
      injuryCategory: news?.severity ?? injuryCategoryOf(p.injuryStatus, p.status),
      drafted,
      round: idx != null ? Math.ceil((idx+1)/settings.leagueSize) : null,
    };
  });
}

    return;
  }
  const all = mergedPlayers();
  const currentOverallPick = draft.picks.length + 1;
  const currentRound = Math.ceil(currentOverallPick / settings.leagueSize);
  const estSlot = slotOnClock(currentOverallPick, settings.leagueSize);

  const myPicks = draft.picks.filter(p=>p.isMe).map(p => all.find(pl => pl.id===p.playerId)).filter(Boolean);
  const myRosterCounts = { QB:0,RB:0,WR:0,TE:0,K:0,DEF:0 };
  for (const pl of myPicks) myRosterCounts[pl.position] = (myRosterCounts[pl.position]??0)+1;
  const myByeWeekCounts = new Map();
  for (const pl of myPicks) {
    const bye = BYE_WEEKS[pl.team];
    if (bye != null) myByeWeekCounts.set(bye, (myByeWeekCounts.get(bye)||0)+1);
  }
  const teamGrades = computeTeamGrades(myRosterCounts, settings);

  const available = all.filter(p=>!p.drafted && p.team); // p.team null = free agent/unrostered, not draftable
  const scores = scoreAllPlayers({ pool: available, settings, currentOverallPick, myRosterCounts, myByeWeekCounts });

  // Opponent rosters, grouped by the actual manager name entered when each
  // pick was marked "Taken" (falls back to an estimated snake-draft slot
  // for any older picks made before named tracking existed).
  const opponentGroups = {};
  const adpLookup = new Map(all.map(p => [p.id, p.adp]));
  draft.picks.forEach((pick, i) => {
    if (pick.isMe) return;
    const label = pick.takenBy || ("Slot " + slotOnClock(i+1, settings.leagueSize) + " (unnamed)");

    '<header class="border-b border-ink-700 bg-ink-900 px-6 py-3 flex items-center gap-6 flex-wrap">',

    '<div><p class="text-[10px] font-mono uppercase text-slate2-500">Round</p><p class="text-xl font-display font-semibold tabular">'+currentRound+'</p></div>',
    '<div><p class="text-[10px] font-mono uppercase text-slate2-500">Overall Pick</p><p class="text-xl font-display font-semibold tabular">'+currentOverallPick+'</p></div>',
    '<div><p class="text-[10px] font-mono uppercase text-slate2-500">Est. slot on clock</p><p class="text-xl font-display font-semibold tabular">'+estSlot+'</p></div>',
    '<div class="ml-auto flex items-center gap-3">',
    '<button id="undoBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-ink-500'+(draft.picks.length===0?" opacity-40 pointer-events-none":"")+'">Undo last pick</button>',
    '<button id="resetBtn" class="text-xs px-3 py-1.5 rounded border border-crimson-600/50 text-crimson-400 hover:bg-crimson-600/10">Reset draft</button>',
    '<button id="teamsNavBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-ink-500">Teams</button>',
    '<button id="traceNavBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-amber-500">Trace</button>',
    '<button id="settingsBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-ink-500">Edit setup</button>',
    '</div></header>',
    '<div class="flex-1 grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-4 p-4 min-h-0">',
    '<div class="min-h-0 flex flex-col">',

    '<input id="search" placeholder="Search players…" value="'+searchTerm+'" class="input max-w-xs" />',
    '<div id="posFilters" class="flex gap-1 flex-wrap"></div>',
    '</div>',
    '<div class="flex-1 overflow-y-auto rounded-lg border border-ink-700">',
    '<table class="w-full text-sm"><thead class="sticky top-0 bg-ink-900 text-slate2-400 text-xs font-mono uppercase"><tr>',
    sortableTh("score","Score","w-16"), sortableTh("name","Player",""), sortableTh("position","Pos","w-14"), sortableTh("team","Team","w-16"),
    sortableTh("adp","Avg ADP","w-20"), sortableTh("claudeAdp","Claude ADP","w-20"), sortableTh("myRank","My ADP","w-16"), sortableTh("projPoints","Proj","w-16"), sortableTh("injury","News / Health","w-24"),
    '<th data-sort-key="flags" class="text-left px-3 py-2 cursor-pointer select-none hover:text-slate2-200'+(sortKey==="flags"?" text-turf-400":"")+'">Flags'+(sortKey==="flags"?(sortDir==="asc"?" ▲":" ▼"):"")+'</th><th class="w-36"></th>',

    '</div>',

    '</div>',
    '<div class="bg-ink-900 border border-ink-700 rounded-lg p-4">',
    '<p class="text-xs uppercase tracking-wide text-slate2-400 font-mono mb-1">Opponent Teams</p>',

    '<div id="opponentTeams" class="space-y-2 max-h-72 overflow-y-auto"></div>',
    '</div></div></div></div>'
  ].join("");

  const posFiltersDiv = document.getElementById("posFilters");
  ["ALL",...POSITIONS,"SLEEPERS"].forEach(pos => {
    const btn = document.createElement("button");
    btn.textContent = pos==="SLEEPERS" ? "🏆 Sleepers" : pos;
    const active = pos===posFilter;
    btn.className = "text-xs px-2.5 py-1.5 rounded border font-mono " + (active ? (pos==="SLEEPERS"?"bg-violet2-500 border-violet2-400 text-ink-950 font-semibold":"bg-turf-600 border-turf-500 text-ink-950 font-semibold") : "border-ink-600 text-slate2-300 hover:border-ink-500");

  document.getElementById("search").addEventListener("input", e => { searchTerm = e.target.value; renderPlayerRows(available, scores); });
  document.querySelectorAll("[data-sort-key]").forEach(th => {

      const key = th.dataset.sortKey;
      if (sortKey===key) sortDir = sortDir==="asc"?"desc":"asc";
      else { sortKey = key; sortDir = (key==="name"||key==="position"||key==="team") ? "asc" : "desc"; }
      renderDraft();
    });
  });
  renderPlayerRows(available, scores);
  renderPickHistory(all);
  renderTopPicks(available, scores);
  renderOpponentTeams(opponentGroups, all, adpLookup);

  document.getElementById("undoBtn").onclick = () => { draft.picks.pop(); save(DRAFT_KEY, draft); renderDraft(); };

function renderPickHistory(all) {
  const byId = new Map(all.map(p=>[p.id,p]));
  const div = document.getElementById("pickHistory");
  if (draft.picks.length===0) { div.innerHTML = '<p class="text-xs text-slate2-500 italic">Draft has not started</p>'; return; }
  div.innerHTML = draft.picks.map((pick,i) => {
    const pl = byId.get(pick.playerId);
    return '<div class="flex items-center justify-between text-xs group"><span class="'+(pick.isMe?"text-turf-400 font-medium":"text-slate2-300")+'">#'+(i+1)+' '+esc(pl?.name??pick.playerId)+'</span><span class="flex items-center gap-2"><span class="font-mono text-slate2-500">'+(pick.isMe?"YOU":esc(pick.takenBy||"Taken"))+'</span><button data-undo-idx="'+i+'" class="opacity-0 group-hover:opacity-100 text-crimson-400 hover:text-crimson-300 text-[10px]" title="Remove this pick">✕</button></span></div>';
  }).reverse().join("");
  div.querySelectorAll("[data-undo-idx]").forEach(btn => {
    btn.addEventListener("click", () => { draft.picks.splice(Number(btn.dataset.undoIdx),1); save(DRAFT_KEY, draft); renderDraft(); });
  });
}

// Best Pick / Safest Pick / Best Value / Biggest Sleeper — same score/flag
// data already computed, just surfaced as labeled callouts instead of
// making you scan the table for them.
function renderTopPicks(available, scores) {
  const el = document.getElementById("topPicks");
  if (!el) return;
  const withScores = available.map(p => ({ p, r: scores.get(p.id) })).filter(x => x.r);
  if (!withScores.length) { el.innerHTML = ""; return; }

  const bestPick = [...withScores].sort((a,b) => b.r.score - a.r.score)[0];
  const safest = [...withScores].filter(x => x.p.injuryCategory === "green").sort((a,b) => b.r.score - a.r.score)[0];
  const bestValue = [...withScores].filter(x => x.p.adp != null).sort((a,b) => (b.r.flags.find(f=>f.type==="steal")?1:0) - (a.r.flags.find(f=>f.type==="steal")?1:0) || b.r.score - a.r.score)[0];
  const sleeper = [...withScores].filter(x => x.p.expertSleeper).sort((a,b) => b.r.score - a.r.score)[0];

  const cards = [
    ["Best Pick", bestPick, "turf"],
    ["Safest Pick", safest, "turf"],
    ["Best Value", bestValue, "amber"],
    ["Biggest Sleeper", sleeper, "violet2"],
  ].filter(([,x]) => x);

  el.innerHTML = cards.map(([label, x, color]) => (
    '<div class="bg-ink-900 border border-ink-700 rounded-lg p-3">'
    + '<p class="text-[10px] font-mono uppercase text-slate2-500 mb-1">' + label + '</p>'
    + '<p class="text-sm font-medium text-slate2-200">' + esc(x.p.name) + '</p>'
    + '<p class="text-[10px] font-mono text-'+color+'-400">Score ' + x.r.score + ' · ' + x.p.position + '</p>'
    + '</div>'
  )).join("");
}

function renderOpponentTeams(opponentGroups, allPlayers, adpLookup) {
  const el = document.getElementById("opponentTeams");
  if (!el) return;
  const byId = new Map(allPlayers.map(p => [p.id, p]));
  const names = Object.keys(opponentGroups).sort();
  if (!names.length) { el.innerHTML = '<p class="text-xs text-slate2-500 italic">No opponent picks logged yet — name the manager when you click "Taken"</p>'; return; }

  el.innerHTML = names.map(name => {
    const picks = opponentGroups[name];
    const grade = computeOpponentGrade(picks, byId, adpLookup);
    const posCounts = {};
    for (const pick of picks) { const pl = byId.get(pick.playerId); if (pl) posCounts[pl.position] = (posCounts[pl.position]||0)+1; }
    const needs = ["QB","RB","WR","TE"].filter(pos => !posCounts[pos]);
    return '<div class="bg-ink-800/60 rounded p-2.5">'
      + '<div class="flex items-center justify-between mb-1">'
      + '<span class="text-xs font-mono text-slate2-300">' + esc(name) + '</span>'
      + '<span class="text-xs font-mono ' + (GRADE_COLOR[grade.letter]||"text-slate2-400") + '">' + grade.letter + (grade.avgValue!=null ? ' (' + (grade.avgValue>=0?'+':'') + grade.avgValue.toFixed(1) + ')' : '') + '</span>'
      + '</div>'
      + '<p class="text-[11px] text-slate2-400 leading-relaxed">' + esc(picks.map(pick => byId.get(pick.playerId)?.name || pick.playerId).join(", ")) + '</p>'
      + (needs.length ? '<p class="text-[10px] text-amber-400 mt-1">Still needs: ' + needs.join(", ") + '</p>' : '')
      + '</div>';
  }).join("");
}

      + '<td class="px-3 py-2 tabular text-slate2-400">'+(p.consensusAdp?p.consensusAdp.toFixed(1):"—")+'</td>'
      + '<td class="px-3 py-2 tabular text-violet2-400">'+(p.claudeAdp?p.claudeAdp.toFixed(1):"—")+'</td>'
      + '<td class="px-3 py-2" onclick="event.stopPropagation()"><input data-myadp="'+p.id+'" type="number" step="0.1" class="mini-input" value="'+(p.myRank??"")+'" placeholder="—" /></td>'
      + '<td class="px-3 py-2 tabular text-slate2-400">'+(p.projPoints?p.projPoints.toFixed(1):"—")+'</td>'
      + '<td class="px-3 py-2"><span class="text-[10px] px-1.5 py-0.5 rounded border font-mono uppercase '+injuryStyles[p.injuryCategory]+'" title="'+esc(p.newsNote||"")+'">'+injuryLabel[p.injuryCategory]+(p.newsNote?' 📰':'')+'</span></td>'
      + '<td class="px-3 py-2"><div class="flex flex-wrap gap-1 max-w-xs">'+(result?.flags??[]).slice(0,2).map(f=>flagPill(f)).join("")+'</div></td>'
      + '<td class="px-3 py-2 text-right"><div class="flex gap-1 justify-end"><button data-mine-btn="'+p.id+'" class="text-xs px-2 py-1 rounded bg-turf-600 hover:bg-turf-500 text-ink-950 font-semibold">Mine</button><button data-taken-btn="'+p.id+'" class="text-xs px-2 py-1 rounded bg-ink-700 hover:bg-ink-600 text-slate2-300">Taken</button></div></td>'
      + '</tr>' + expandedRow;
  }).join("");

  tbody.querySelectorAll("[data-player-row]").forEach(row => row.addEventListener("click", () => { expandedPlayerId = expandedPlayerId===row.dataset.playerRow ? null : row.dataset.playerRow; renderPlayerRows(available, scores); }));
  tbody.querySelectorAll("[data-mine-btn]").forEach(btn => btn.addEventListener("click", e => { e.stopPropagation(); makePick(btn.dataset.mineBtn, true); }));
  tbody.querySelectorAll("[data-taken-btn]").forEach(btn => btn.addEventListener("click", e => {
    e.stopPropagation();
    const id = btn.dataset.takenBtn;
    const recent = load(MANAGER_NAMES_KEY, []);
    const suggestion = recent.length ? recent[recent.length-1] : "";
    const name = window.prompt("Which manager took this player? (type a name — reuses last one if you leave it)", suggestion);
    if (name === null) return; // cancelled
    const finalName = name.trim() || suggestion || "Unknown";
    if (finalName && !recent.includes(finalName)) { recent.push(finalName); save(MANAGER_NAMES_KEY, recent.slice(-20)); }
    makePick(id, false, finalName);
  }));
  tbody.querySelectorAll("[data-myadp]").forEach(input => {
    input.addEventListener("change", e => {
      const id = input.dataset.myadp, val = e.target.value;
      if (val==="") delete myRanks[id]; else myRanks[id] = Number(val);
      save(MYRANK_KEY, myRanks);
    });
  });
}
function flagPill(f) {
  const styles = { steal:"bg-turf-600/20 text-turf-400 border-turf-600/40", sleeper:"bg-violet2-500/20 text-violet2-400 border-violet2-500/40", reach:"bg-crimson-600/20 text-crimson-400 border-crimson-600/40", bust_risk:"bg-crimson-600/20 text-crimson-400 border-crimson-600/40", injury:"bg-orange-500/20 text-orange-400 border-orange-500/40", scarcity:"bg-amber-500/20 text-amber-400 border-amber-500/40", bye_stack:"bg-amber-500/20 text-amber-400 border-amber-500/40", news:"bg-ink-700 text-slate2-300 border-ink-600" };
  return '<span class="text-[10px] px-1.5 py-0.5 rounded border whitespace-nowrap '+(styles[f.type]||"bg-ink-700 text-slate2-300 border-ink-600")+'">'+esc(f.label)+'</span>';
}
function makePick(playerId, isMe, takenBy) { draft.picks.push({ playerId, isMe, takenBy: isMe ? null : (takenBy || "Unknown") }); save(DRAFT_KEY, draft); renderDraft(); }

// ============================================================
// TEAMS TAB — all 32 NFL teams + depth charts (ESPN, unofficial).
// ============================================================
async function renderTeams() {
  const root = document.getElementById("root");
  const backLabel = settings ? "← Back to draft" : "← Back to setup";

  root.innerHTML = [
    '<div class="min-h-screen px-4 py-6 max-w-5xl mx-auto">',
    '<div class="flex items-center justify-between mb-4">',
    '<div>',
    '<p class="text-turf-400 font-mono text-xs tracking-widest uppercase mb-1">Command Center <span class="text-slate2-600">' + APP_VERSION + '</span></p>',
    '<h1 class="text-2xl font-display font-semibold text-slate2-200">Teams &amp; Depth Charts</h1>',
    '</div>',
    '<div class="flex items-center gap-3">',
    '<button id="syncTeamsBtn" class="text-xs px-3 py-2 rounded bg-ink-800 border border-ink-600 hover:border-turf-500">Sync teams (ESPN)</button>',
    '<button id="traceNavBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-amber-500">Trace</button>',
    '<button id="backFromTeamsBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-ink-500">' + backLabel + '</button>',
    '</div></div>',
    '<p id="teamsSyncStatus" class="text-xs text-slate2-400 mb-4"></p>',
    '<div id="teamsGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>',
    '<div id="depthChartPanel" class="mt-6"></div>',
    '</div>'
  ].join("");

  document.getElementById("backFromTeamsBtn").onclick = () => { settings ? renderDraft() : renderSetup(); };
  document.getElementById("traceNavBtn").onclick = () => renderTrace();
  document.getElementById("syncTeamsBtn").onclick = async () => {
    const statusEl = document.getElementById("teamsSyncStatus");
    statusEl.textContent = "Syncing…";
    try {
      teamsCache = await syncEspnTeams();
      statusEl.innerHTML = teamsCache.isStaticFallback
        ? '<span class="text-amber-400">⚠ Live ESPN sync unavailable right now — using the embedded team list instead (logos and depth charts still work fine, neither depends on the API that\'s failing). Check Trace for details.</span>'
        : "Synced " + teamsCache.teams.length + " teams · " + new Date(teamsCache.updatedAt).toLocaleString();
      renderTeamsGrid();
    } catch (e) {
      statusEl.textContent = "Failed: " + e.message;
    }
  };

  document.getElementById("teamsSyncStatus").innerHTML = teamsCache.updatedAt
    ? (teamsCache.isStaticFallback
        ? '<span class="text-amber-400">⚠ Using embedded team list (live ESPN sync unavailable) — logos and depth charts below still work fine, neither depends on ESPN\'s API. Last attempt ' + new Date(teamsCache.updatedAt).toLocaleString() + '.</span>'
        : 'Last synced ' + new Date(teamsCache.updatedAt).toLocaleString())
    : 'Not synced yet — click "Sync teams" to load all 32 teams.';
  renderTeamsGrid();
}

function renderTeamsGrid() {
  const grid = document.getElementById("teamsGrid");
  if (!grid) return;
  if (!teamsCache.teams.length) {
    grid.innerHTML = '<p class="text-sm text-slate2-500 col-span-full italic">No teams synced yet.</p>';
    return;
  }
  grid.innerHTML = teamsCache.teams.map(t => (
    '<button data-team-id="' + t.id + '" class="flex flex-col items-center gap-2 bg-ink-900 border border-ink-700 rounded-lg p-3 hover:border-turf-500' + (openTeamId===t.id ? " border-turf-500" : "") + '">'
    + (t.logo ? '<img src="' + t.logo + '" alt="" class="w-10 h-10 object-contain" />' : '<div class="w-10 h-10 rounded-full bg-ink-800"></div>')
    + '<span class="text-xs text-slate2-300 text-center leading-tight">' + esc(t.name) + '</span>'
    + '</button>'
  )).join("");
  grid.querySelectorAll("[data-team-id]").forEach(btn => {
    btn.addEventListener("click", () => openDepthChart(btn.dataset.teamId));
  });
}

async function openDepthChart(teamId) {
  openTeamId = teamId;
  renderTeamsGrid();
  const panel = document.getElementById("depthChartPanel");
  const team = teamsCache.teams.find(t => t.id === teamId);
  const abbr = (team?.abbreviation || "").toUpperCase();
  const staticChart = DEPTH_CHARTS[abbr];

  if (staticChart) {
    renderStaticDepthChart(panel, team, abbr, staticChart);
  } else {
    panel.innerHTML = '<div class="bg-ink-900 border border-amber-500/40 rounded-lg p-4"><p class="text-sm text-amber-400">No researched depth chart on file for ' + esc(team?.name || teamId) + ' yet — ask Claude to add it.</p></div>';
  }
  // The depth chart renders below the full 32-team grid — on a phone
  // that's well off-screen, so clicking a team looked like nothing
  // happened even when it worked correctly. Scroll it into view.
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderStaticDepthChart(panel, team, abbr, chart) {
  const groups = ["QB","RB","WR","TE"].filter(pos => chart[pos]);
  panel.innerHTML = '<div class="bg-ink-900 border border-ink-700 rounded-lg p-4">'
    + '<div class="flex items-center justify-between mb-1">'
    + '<p class="text-sm font-display font-semibold text-slate2-200">' + esc(team?.name || abbr) + ' Depth Chart</p>'
    + '<div class="flex items-center gap-2">'
    + '<span class="text-[10px] font-mono text-slate2-500">Researched ' + new Date(DEPTH_CHARTS_UPDATED).toLocaleDateString() + '</span>'
    + '<button id="liveCheckBtn" class="text-[10px] px-2 py-1 rounded border border-ink-600 text-slate2-400 hover:border-turf-500">Try live ESPN check</button>'
    + '</div></div>'
    + '<p class="text-[10px] text-slate2-500 mb-3">Skill positions only (QB/RB/WR/TE) — what matters for fantasy. Ask Claude to refresh before your draft.</p>'
    + '<div id="liveCheckStatus" class="text-[11px] text-slate2-400 mb-2"></div>'
    + '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">'
    + groups.map(pos => (
        '<div class="bg-ink-800 rounded p-3">'
        + '<p class="text-xs font-mono uppercase text-turf-400 mb-2">' + pos + '</p>'
        + '<ol class="space-y-1">' + chart[pos].map((name, i) => (
            '<li class="text-sm text-slate2-300 flex items-start gap-2"><span class="text-[10px] font-mono text-slate2-500 w-4 shrink-0">' + (i+1) + '</span><span>' + esc(name) + '</span></li>'
          )).join("") + '</ol></div>'
      )).join("")
    + '</div></div>';

  document.getElementById("liveCheckBtn").onclick = async () => {
    const statusEl = document.getElementById("liveCheckStatus");
    statusEl.textContent = "Checking ESPN live for comparison…";
    try {
      const cached = loadCachedDepthCharts()[team.id];
      const live = cached || await fetchTeamDepthChart(team.id);
      if (live.groups && live.groups.length) {
        statusEl.innerHTML = '<span class="text-turf-400">Live ESPN data loaded — ' + live.groups.length + ' position groups found. Check Trace for the raw comparison if you want to verify against the researched list above.</span>';
      } else {
        statusEl.textContent = "ESPN responded but in an unexpected shape — sticking with the researched depth chart above.";
      }
    } catch (e) {
      statusEl.textContent = "Live ESPN check failed (" + e.message + ") — the researched depth chart above is still shown.";
    }
  };
}



// ============================================================
// TRACE TAB — every live-data request attempt, with a one-tap copy
// so you can paste the exact error back to Claude instead of retyping
// a summary of what you saw.
// ============================================================
function formatTraceLog() {
  if (!traceLog.length) return "(empty — try a sync first, then come back here)";
  return traceLog.map(e => {
    const t = new Date(e.time).toLocaleTimeString();
    return "[" + t + "] " + e.action + " — " + e.status + (e.detail ? " — " + e.detail : "") + "\nURL: " + e.url;
  }).join("\n\n");
}

function renderTrace() {
  const root = document.getElementById("root");
  const backLabel = settings ? "\u2190 Back to draft" : "\u2190 Back to setup";
  root.innerHTML = [
    '<div class="min-h-screen px-4 py-6 max-w-3xl mx-auto">',
    '<div class="flex items-center justify-between mb-2">',
    '<div>',
    '<p class="text-amber-400 font-mono text-xs tracking-widest uppercase mb-1">Command Center <span class="text-slate2-600">' + APP_VERSION + '</span></p>',
    '<h1 class="text-2xl font-display font-semibold text-slate2-200">Trace Log</h1>',
    '</div>',
    '<div class="flex items-center gap-2">',
    '<button id="copyTraceBtn" class="text-xs px-3 py-2 rounded bg-turf-600 hover:bg-turf-500 text-ink-950 font-semibold">Copy all</button>',
    '<button id="clearTraceBtn" class="text-xs px-3 py-2 rounded border border-crimson-600/50 text-crimson-400 hover:bg-crimson-600/10">Clear</button>',
    '<button id="backFromTraceBtn" class="text-xs px-3 py-1.5 rounded border border-ink-600 hover:border-ink-500">' + backLabel + '</button>',
    '</div></div>',
    '<p class="text-xs text-slate2-400 mb-4">Every "Sync" click on this page logs here \u2014 timing, the exact URL called, and the real error detail (not just "Load failed"). Copy this and paste it to Claude if a sync fails.</p>',
    '<span id="copyStatus" class="text-xs text-turf-400"></span>',
    '<pre id="traceOutput" class="text-[11px] leading-relaxed text-slate2-300 bg-ink-900 border border-ink-700 rounded-lg p-4 whitespace-pre-wrap break-all max-h-[70vh] overflow-y-auto mt-2"></pre>',
    '</div>'
  ].join("");

  document.getElementById("traceOutput").textContent = formatTraceLog();
  document.getElementById("backFromTraceBtn").onclick = () => { settings ? renderDraft() : renderSetup(); };
  document.getElementById("clearTraceBtn").onclick = () => { traceLog = []; document.getElementById("traceOutput").textContent = formatTraceLog(); };
  document.getElementById("copyTraceBtn").onclick = async () => {
    const text = formatTraceLog();
    const statusEl = document.getElementById("copyStatus");
    try {
      await navigator.clipboard.writeText(text);
      statusEl.textContent = "Copied!";
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try {
        document.execCommand("copy");
        statusEl.textContent = "Copied!";
      } catch {
        statusEl.textContent = "Couldn't auto-copy \u2014 tap and hold the text below to select and copy manually.";
      }
      document.body.removeChild(ta);
    }
    setTimeout(() => { statusEl.textContent = ""; }, 3000);
  };
}

settings ? renderDraft() : renderSetup();
</script>
